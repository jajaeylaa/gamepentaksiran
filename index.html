<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART CILIK GAME HUB - Edisi Realistik Wang Malaysia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .animate-bounce-gentle {
            animation: bounce 2s infinite;
        }
        .glow-hint {
            box-shadow: 0 0 25px #f59e0b;
            border-color: #f59e0b !important;
            animation: pulse 1.2s infinite;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="bg-sky-100 text-slate-800 min-h-screen">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ==========================================
// 1. DATABASE BARANGAN REALISTIK
// ==========================================
const PRODUCTS = {
    sos: { id: "sos", name: "Sos Cili", price: 2, icon: "🥫" },
    jus: { id: "jus", name: "Jus Epal Kotak", price: 2, icon: "🧃" },
    gula: { id: "gula", name: "Gula", price: 3, icon: "🍬" },
    kicap: { id: "kicap", name: "Kicap", price: 3, icon: "🍾" },
    susu_pekat: { id: "susu_pekat", name: "Susu Pekat", price: 4, icon: "🥛" },
    teh: { id: "teh", name: "Teh", price: 4, icon: "☕" },
    susu_kotak: { id: "susu_kotak", name: "Susu Kotak", price: 5, icon: "🧃" },
    sardin: { id: "sardin", name: "Sardin", price: 5, icon: "🐟" }
};

// ==========================================
// 2. BANK SOALAN LENGKAP MINI GAME 1 - 7
// ==========================================
const QUESTION_BANK = {
    mg1: [
        { id: "mg1_1", skill: "Kenali Wang", audio: "Cari wang satu ringgit.", options: [1, 5, 10], correct: 1 },
        { id: "mg1_2", skill: "Kenali Wang", audio: "Cari wang lima ringgit.", options: [10, 1, 5], correct: 5 },
        { id: "mg1_3", skill: "Kenali Wang", audio: "Cari wang sepuluh ringgit.", options: [5, 10, 1], correct: 10 }
    ],
    mg2: [
        { id: "mg2_1", skill: "Banding Harga", audio: "Yang mana lebih murah?", items: [PRODUCTS.sos, PRODUCTS.gula], correct: "Sos Cili" },
        { id: "mg2_2", skill: "Banding Harga", audio: "Yang mana perlukan wang lebih banyak?", items: [PRODUCTS.jus, PRODUCTS.sardin], correct: "Sardin" }
    ],
    mg3: [
        { id: "mg3_1", skill: "Bina Wang", audio: "Sediakan dua ringgit.", target: 2, correct: 2 },
        { id: "mg3_2", skill: "Bina Wang", audio: "Sediakan lima ringgit.", target: 5, correct: 5 },
        { id: "mg3_3", skill: "Bina Wang", audio: "Sediakan tujuh ringgit.", target: 7, correct: 7 }
    ],
    mg4: [
        { id: "mg4_1", skill: "Kumpul & Kira", audio: "Berapa wang diperlukan untuk kedua-dua barang?", items: [PRODUCTS.sos, PRODUCTS.gula], correct: 5, eq: "RM2 + RM3 = RM5" },
        { id: "mg4_2", skill: "Kumpul & Kira", audio: "Berapa wang diperlukan untuk kedua-dua barang?", items: [PRODUCTS.gula, PRODUCTS.susu_pekat], correct: 7, eq: "RM3 + RM4 = RM7" }
    ],
    mg5: [
        { id: "mg5_1", skill: "Kupon Ajaib", audio: "Harga lima ringgit. Kupon kurangkan satu ringgit. Sediakan wang yang perlu dibayar.", base: 5, coupon: 1, correct: 4, eq: "RM5 - RM1 = RM4" },
        { id: "mg5_2", skill: "Kupon Ajaib", audio: "Harga sepuluh ringgit. Kupon kurangkan dua ringgit. Sediakan wang yang perlu dibayar.", base: 10, coupon: 2, correct: 8, eq: "RM10 - RM2 = RM8" }
    ],
    mg6: [
        { id: "mg6_1", skill: "Cukup Tak Duit?", audio: "Duit kamu cukup atau belum?", price: 3, myMoney: [1, 1, 1], correct: "Cukup", explanation: "Kamu ada 3 ringgit. Cukup untuk beli!" },
        { id: "mg6_2", skill: "Cukup Tak Duit?", audio: "Duit kamu cukup atau belum?", price: 4, myMoney: [1, 1, 1], correct: "Belum Cukup", explanation: "Kamu ada 3 ringgit. Perlu 1 ringgit lagi." }
    ],
    mg7: [
        { id: "mg7_1", skill: "Detektif Kira", audio: "Detektif kata duit dia cukup. Betul atau tidak?", price: 5, mascotMoney: [5], mascotClaim: "Duit saya cukup.", correct: true, explanation: "Betul! Maskot ada 5 ringgit." },
        { id: "mg7_2", skill: "Detektif Kira", audio: "Detektif kata jumlahnya RM6. Betul atau tidak?", eqText: "RM3 + RM4 = RM6", mascotClaim: "Jumlahnya RM6.", correct: false, explanation: "Salah! Tiga tambah empat sepatutnya RM7." }
    ]
};

// ==========================================
// 3. SET CABARAN SMART CILIK (MINI GAME 8)
// ==========================================
const CHALLENGE_SETS = [
    [
        { id: "c_a1", game: "mg1", skill: "Kenali Wang", audio: "Cari wang lima ringgit.", options: [1, 5, 10], correct: 5 },
        { id: "c_a2", game: "mg2", skill: "Banding Harga", audio: "Yang mana lebih murah?", items: [PRODUCTS.sos, PRODUCTS.teh], correct: "Sos Cili" },
        { id: "c_a3", game: "mg3", skill: "Bina Wang", audio: "Sediakan tujuh ringgit.", target: 7, correct: 7 },
        { id: "c_a4", game: "mg4", skill: "Kumpul & Kira", audio: "Berapa wang diperlukan untuk kedua-dua barang?", items: [PRODUCTS.gula, PRODUCTS.jus], correct: 5, eq: "RM3 + RM2 = RM5" },
        { id: "c_a5", game: "mg5", skill: "Kupon Ajaib", audio: "Harga sepuluh ringgit. Kupon kurangkan dua ringgit.", base: 10, coupon: 2, correct: 8, eq: "RM10 - RM2 = RM8" }
    ]
];

// AUDIO SYNTHESIS
const speak = (text) => {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ms-MY';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
    }
};

const getMoneyVisual = (val) => {
    if (val === 1) return { bg: "bg-blue-600 border-blue-800", label: "RM1", name: "Satu Ringgit (Biru)" };
    if (val === 5) return { bg: "bg-emerald-600 border-emerald-800", label: "RM5", name: "Lima Ringgit (Hijau)" };
    if (val === 10) return { bg: "bg-red-600 border-red-800", label: "RM10", name: "Sepuluh Ringgit (Merah)" };
    return { bg: "bg-amber-600 border-amber-800", label: `RM${val}`, name: `${val} Ringgit` };
};

function App() {
    const [screen, setScreen] = useState('splash');
    const [nickname, setNickname] = useState('');
    const [avatar, setAvatar] = useState('🐼');
    const [score, setScore] = useState(0);
    const [stars, setStars] = useState(0);
    const [currentGame, setCurrentGame] = useState('');
    const [questions, setQuestions] = useState([]);
    const [qIndex, setQIndex] = useState(0);
    const [attempts, setAttempts] = useState(0);
    const [showHint, setShowHint] = useState(false);
    const [logs, setLogs] = useState([]);
    const [teacherAuth, setTeacherAuth] = useState(false);
    const [passInput, setPassInput] = useState('');

    const [myMoneyList, setMyMoneyList] = useState([]);
    const [showEquation, setShowEquation] = useState(false);

    const avatars = ['🐼', '🐰', '🐯', '🐱', '🦊', '🐻'];

    useEffect(() => {
        if (screen === 'splash') {
            speak("Hai! Selamat datang ke SMART CILIK GAME HUB. Jom belajar wang!");
        }
    }, [screen]);

    const startMiniGame = (gameId) => {
        setCurrentGame(gameId);
        let pool = [];
        if (gameId === 'mg8') {
            pool = CHALLENGE_SETS[Math.floor(Math.random() * CHALLENGE_SETS.length)];
        } else {
            pool = [...(QUESTION_BANK[gameId] || QUESTION_BANK['mg1'])].sort(() => 0.5 - Math.random());
        }
        setQuestions(pool);
        setQIndex(0);
        resetGameState(pool[0]);
        setScreen('game');
    };

    const resetGameState = (q) => {
        setAttempts(0);
        setShowHint(false);
        setMyMoneyList([]);
        setShowEquation(false);
        if (q) {
            setTimeout(() => speak(q.audio), 300);
        }
    };

    const currentQ = questions[qIndex];

    const handleAnswer = (userAnswer) => {
        const isCorrect = userAnswer === currentQ.correct;

        const logEntry = {
            student: nickname || "Murid",
            game: currentGame,
            skill: currentQ.skill,
            isCorrect,
            attempts: attempts + 1,
            hintUsed: showHint,
            timestamp: new Date().toLocaleTimeString('ms-MY')
        };
        setLogs(prev => [...prev, logEntry]);

        if (isCorrect) {
            const addedScore = attempts === 0 ? 10 : attempts === 1 ? 7 : 5;
            setScore(prev => prev + addedScore);
            setStars(prev => prev + 1);

            confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            
            if (currentQ.eq || currentQ.explanation) {
                setShowEquation(true);
            }

            speak("Hebat! Jawapan betul!");

            setTimeout(() => {
                if (qIndex + 1 < questions.length) {
                    const nextQ = questions[qIndex + 1];
                    setQIndex(prev => prev + 1);
                    resetGameState(nextQ);
                } else {
                    const finalBonus = currentGame === 'mg8' ? 30 : 20;
                    setScore(prev => prev + finalBonus);
                    speak("Tahniah! Kamu berjaya menyelesaikan aktiviti ini!");
                    setScreen('menu');
                }
            }, 2500);
        } else {
            const newAttempts = attempts + 1;
            setAttempts(newAttempts);
            speak("Cuba lagi.");
            if (newAttempts >= 2) {
                setShowHint(true);
            }
        }
    };

    const calculateTP = () => {
        if (logs.length === 0) return "Belum Dinilai";
        const correct = logs.filter(l => l.isCorrect).length;
        const ratio = correct / logs.length;
        if (ratio >= 0.8) return "TP 3 (Tinggi - Menguasai Sangat Baik)";
        if (ratio >= 0.5) return "TP 2 (Sederhana - Menguasai Dengan Bimbingan)";
        return "TP 1 (Perlu Bimbingan Berterusan)";
    };

    const addMoney = (val) => {
        setMyMoneyList(prev => [...prev, val]);
    };

    const clearMoney = () => {
        setMyMoneyList([]);
    };

    const currentTotalMoney = myMoneyList.reduce((a, b) => a + b, 0);

    return (
        <div className="max-w-md mx-auto min-h-screen bg-sky-50 border-x-4 border-sky-200 flex flex-col justify-between p-4 relative overflow-hidden">
            
            {/* NAV BAR */}
            {screen !== 'splash' && screen !== 'teacher' && screen !== 'ranking' && (
                <div className="bg-white rounded-2xl p-3 shadow-md border-2 border-sky-200 flex justify-between items-center mb-3">
                    <div className="flex items-center gap-2">
                        <span className="text-3xl animate-bounce-gentle">{avatar}</span>
                        <div>
                            <span className="font-bold text-sky-800 text-sm block leading-none">{nickname || 'Murid'}</span>
                            <span className="text-[10px] text-amber-600 font-bold">SMART CILIK</span>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <span className="text-amber-500 font-bold text-xs bg-amber-50 px-2 py-1 rounded-xl border border-amber-200">⭐ {stars}</span>
                        <span className="text-emerald-600 font-bold text-xs bg-emerald-50 px-2 py-1 rounded-xl border border-emerald-200">{score} Mata</span>
                        <button onClick={() => { speak("Kembali ke menu utama"); setScreen('menu'); }} className="bg-sky-100 p-2 rounded-xl text-sky-700">🏠</button>
                    </div>
                </div>
            )}

            {/* SPLASH SCREEN */}
            {screen === 'splash' && (
                <div className="my-auto flex flex-col items-center text-center bg-white p-6 rounded-3xl shadow-xl border-4 border-sky-300">
                    <div className="text-7xl mb-2 animate-bounce-gentle">🛒💵</div>
                    <h1 className="text-2xl font-bold text-sky-600 mb-1">SMART CILIK GAME HUB</h1>
                    <p className="text-xs font-semibold text-amber-600 bg-amber-50 px-3 py-1 rounded-full mb-6 border border-amber-200">
                        Pengalaman Belajar Wang Realistik
                    </p>
                    <button 
                        onClick={() => { speak("Sila masukkan nama anda"); setScreen('profile'); }}
                        className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xl py-4 rounded-2xl shadow-lg border-b-4 border-emerald-700 transition active:scale-95">
                        ▶ MULAKAN MAIN
                    </button>
                </div>
            )}

            {/* PROFILE */}
            {screen === 'profile' && (
                <div className="my-auto bg-white p-6 rounded-3xl shadow-xl border-2 border-sky-200">
                    <h2 className="text-base font-bold text-sky-800 text-center mb-3">👋 SIAPA NAMA KAMU?</h2>
                    <input 
                        type="text" 
                        placeholder="Tulis nama di sini..."
                        value={nickname}
                        onChange={(e) => setNickname(e.target.value)}
                        className="w-full p-3 border-2 border-sky-300 rounded-2xl mb-4 text-center font-bold text-lg focus:outline-none focus:border-sky-500 bg-sky-50"
                    />
                    <p className="text-xs font-bold text-slate-500 mb-2 text-center">PILIH MASKOT:</p>
                    <div className="grid grid-cols-3 gap-3 mb-6">
                        {avatars.map(a => (
                            <button 
                                key={a} 
                                onClick={() => { setAvatar(a); speak(`Kamu pilih ${a}`); }}
                                className={`text-4xl p-3 rounded-2xl border-2 transition ${avatar === a ? 'border-sky-500 bg-sky-100 scale-105 shadow-md' : 'border-slate-100 bg-slate-50'}`}>
                                {a}
                            </button>
                        ))}
                    </div>
                    <button 
                        disabled={!nickname.trim()}
                        onClick={() => { speak(`Hai ${nickname}, mari belajar wang!`); setScreen('menu'); }}
                        className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold text-lg py-3 rounded-2xl shadow-lg disabled:opacity-50 border-b-4 border-sky-700">
                        JOM MAIN! 🚀
                    </button>
                </div>
            )}

            {/* MENU UTAMA */}
            {screen === 'menu' && (
                <div className="flex-1 flex flex-col justify-between">
                    <div className="grid grid-cols-2 gap-3">
                        {[
                            { id: 'mg1', icon: '🪙', title: 'Kenali Wang', color: 'bg-blue-50 border-blue-200' },
                            { id: 'mg2', icon: '⚖️', title: 'Mana Lebih Murah?', color: 'bg-amber-50 border-amber-200' },
                            { id: 'mg3', icon: '🧩', title: 'Bina Wang', color: 'bg-emerald-50 border-emerald-200' },
                            { id: 'mg4', icon: '🛒', title: 'Kumpul & Kira', color: 'bg-purple-50 border-purple-200' },
                            { id: 'mg5', icon: '🎟️', title: 'Kupon Ajaib', color: 'bg-rose-50 border-rose-200' },
                            { id: 'mg6', icon: '💰', title: 'Cukup Tak Duit?', color: 'bg-indigo-50 border-indigo-200' },
                            { id: 'mg7', icon: '🔎', title: 'Detektif Kira', color: 'bg-teal-50 border-teal-200' },
                            { id: 'mg8', icon: '🏆', title: 'Cabaran SMART', color: 'bg-yellow-50 border-yellow-300' },
                        ].map(g => (
                            <button 
                                key={g.id}
                                onClick={() => startMiniGame(g.id)}
                                className={`${g.color} p-3 rounded-2xl shadow border-2 hover:scale-105 flex flex-col items-center text-center gap-1 active:scale-95 transition`}>
                                <span className="text-4xl">{g.icon}</span>
                                <span className="font-bold text-xs text-slate-800">{g.title}</span>
                                <span className="text-[10px] bg-white px-2 py-0.5 rounded-full font-bold text-slate-500 border">Main ➔</span>
                            </button>
                        ))}
                    </div>

                    <div className="mt-3 flex gap-2">
                        <button onClick={() => setScreen('ranking')} className="flex-1 bg-amber-100 text-amber-800 font-bold py-2 rounded-xl border border-amber-300 text-xs text-center">
                            🏆 PAPAN KEDUDUKAN
                        </button>
                        <button onClick={() => setScreen('teacher')} className="flex-1 bg-indigo-100 text-indigo-800 font-bold py-2 rounded-xl border border-indigo-300 text-xs text-center">
                            👩‍🏫 MOD GURU / PBD
                        </button>
                    </div>
                </div>
            )}

            {/* SCREEN PERMAINAN */}
            {screen === 'game' && currentQ && (
                <div className="flex-1 flex flex-col justify-between bg-white rounded-3xl p-4 shadow-xl border-2 border-sky-200 relative">
                    
                    {/* BAR ARAHAN AUDIO */}
                    <div className="flex items-center justify-between bg-sky-50 p-2.5 rounded-2xl border-2 border-sky-200 mb-2 gap-2">
                        <button onClick={() => speak(currentQ.audio)} className="bg-amber-400 text-white p-2.5 rounded-xl shadow hover:bg-amber-500 active:scale-90">🔊</button>
                        <p className="font-bold text-sky-900 text-xs flex-1">{currentQ.audio}</p>
                    </div>

                    {/* MINI GAME 1: KENALI WANG */}
                    {(currentGame === 'mg1' || currentQ.game === 'mg1') && (
                        <div className="my-auto grid grid-cols-1 gap-3">
                            {currentQ.options.map(val => {
                                const vis = getMoneyVisual(val);
                                const isCorrectOpt = val === currentQ.correct;
                                return (
                                    <button 
                                        key={val}
                                        onClick={() => handleAnswer(val)}
                                        className={`p-4 rounded-2xl font-bold text-white text-lg shadow-md border-b-4 ${vis.bg} flex justify-between items-center ${
                                            showHint && isCorrectOpt ? 'glow-hint' : showHint && !isCorrectOpt ? 'opacity-30' : ''
                                        }`}>
                                        <div className="flex items-center gap-2">
                                            <span>💵</span>
                                            <span>{vis.name}</span>
                                        </div>
                                        <span className="bg-white/20 px-3 py-1 rounded-xl text-xs">Pilih 👆</span>
                                    </button>
                                );
                            })}
                        </div>
                    )}

                    {/* MINI GAME 2: MANA LEBIH MURAH? */}
                    {(currentGame === 'mg2' || currentQ.game === 'mg2') && (
                        <div className="my-auto grid grid-cols-2 gap-2">
                            {currentQ.items.map(item => {
                                const isCorrectItem = item.name === currentQ.correct;
                                return (
                                    <button 
                                        key={item.id}
                                        onClick={() => handleAnswer(item.name)}
                                        className={`p-3 rounded-2xl border-4 bg-slate-50 flex flex-col items-center gap-1 active:scale-95 transition ${
                                            showHint && isCorrectItem ? 'glow-hint border-amber-400' : showHint && !isCorrectItem ? 'opacity-30' : 'border-slate-200'
                                        }`}>
                                        <span className="text-4xl">{item.icon}</span>
                                        <span className="font-bold text-xs text-slate-800 text-center">{item.name}</span>
                                        <span className="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">RM{item.price}</span>
                                        <div className="flex gap-1 flex-wrap justify-center mt-1">
                                            {Array.from({ length: item.price }).map((_, i) => (
                                                <span key={i} className="text-[10px] bg-blue-600 text-white px-1 rounded font-bold">RM1</span>
                                            ))}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    )}

                    {/* MINI GAME 3 & 5: BINA WANG / KUPON AJAIB (MANIPULATIF DUIT SAYA) */}
                    {((currentGame === 'mg3' || currentQ.game === 'mg3') || (currentGame === 'mg5' || currentQ.game === 'mg5')) && (
                        <div className="my-auto flex flex-col gap-3">
                            <div className="bg-amber-50 border-2 border-amber-200 p-3 rounded-2xl text-center">
                                <p className="text-xs font-bold text-amber-800 mb-1">DUIT SAYA SAAT INI:</p>
                                <div className="text-2xl font-bold text-amber-600 mb-2">RM {currentTotalMoney}</div>
                                <div className="flex flex-wrap gap-1 justify-center min-h-[40px] bg-white p-2 rounded-xl border border-amber-100">
                                    {myMoneyList.length === 0 ? (
                                        <span className="text-xs text-slate-400 font-bold self-center">Klik butang wang di bawah untuk tambah</span>
                                    ) : (
                                        myMoneyList.map((m, idx) => (
                                            <span key={idx} className={`text-xs text-white px-2 py-1 rounded font-bold ${getMoneyVisual(m).bg}`}>
                                                {getMoneyVisual(m).label}
                                            </span>
                                        ))
                                    )}
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-2">
                                {[1, 5, 10].map(val => (
                                    <button 
                                        key={val} 
                                        onClick={() => addMoney(val)} 
                                        className={`p-2 rounded-xl text-white font-bold text-xs shadow ${getMoneyVisual(val).bg}`}>
                                        + {getMoneyVisual(val).label}
                                    </button>
                                ))}
                            </div>

                            <div className="flex gap-2">
                                <button onClick={clearMoney} className="bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-xl text-xs flex-1">
                                    🔄 Semula
                                </button>
                                <button 
                                    onClick={() => handleAnswer(currentTotalMoney)} 
                                    className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded-xl text-xs flex-1 shadow border-b-2 border-emerald-700">
                                    Hantar Jawapan ➔
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MINI GAME 4: KUMPUL & KIRA */}
                    {(currentGame === 'mg4' || currentQ.game === 'mg4') && (
                        <div className="my-auto flex flex-col items-center gap-3">
                            <div className="flex gap-4 justify-center">
                                {currentQ.items.map(item => (
                                    <div key={item.id} className="bg-slate-50 border-2 border-slate-200 p-3 rounded-2xl flex flex-col items-center">
                                        <span className="text-4xl">{item.icon}</span>
                                        <span className="font-bold text-xs text-slate-800">{item.name}</span>
                                        <span className="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold mt-1">RM{item.price}</span>
                                    </div>
                                ))}
                            </div>

                            <div className="grid grid-cols-3 gap-2 w-full mt-2">
                                {[currentQ.correct - 1, currentQ.correct, currentQ.correct + 2].sort(() => 0.5 - Math.random()).map(val => (
                                    <button 
                                        key={val} 
                                        onClick={() => handleAnswer(val)}
                                        className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl shadow border-b-2 border-purple-800 text-lg">
                                        RM{val}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* MINI GAME 6 & 7: CUKUP TAK DUIT & DETEKTIF KIRA */}
                    {((currentGame === 'mg6' || currentQ.game === 'mg6') || (currentGame === 'mg7' || currentQ.game === 'mg7')) && (
                        <div className="my-auto flex flex-col items-center gap-4">
                            {currentQ.price && (
                                <div className="text-center bg-slate-50 p-3 rounded-2xl border-2 border-slate-200 w-full">
                                    <span className="text-xs text-slate-500 font-bold block">Harga Barang:</span>
                                    <span className="text-2xl font-bold text-amber-600">RM{currentQ.price}</span>
                                </div>
                            )}

                            {currentQ.eqText && (
                                <div className="text-center bg-purple-50 p-3 rounded-2xl border-2 border-purple-200 w-full">
                                    <span className="text-xs text-purple-600 font-bold block">Pengiraan:</span>
                                    <span className="text-xl font-bold text-purple-800">{currentQ.eqText}</span>
                                </div>
                            )}

                            {currentQ.mascotClaim && (
                                <div className="bg-teal-50 border-2 border-teal-200 p-3 rounded-2xl text-center w-full">
                                    <span className="text-2xl block">💬</span>
                                    <span className="font-bold text-teal-900 text-sm">{currentQ.mascotClaim}</span>
                                </div>
                            )}

                            <div className="grid grid-cols-2 gap-3 w-full">
                                {currentGame === 'mg6' || currentQ.game === 'mg6' ? (
                                    ['Cukup', 'Belum Cukup'].map(opt => (
                                        <button 
                                            key={opt} 
                                            onClick={() => handleAnswer(opt)}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow border-b-2 border-indigo-800 text-sm">
                                            {opt}
                                        </button>
                                    ))
                                ) : (
                                    [true, false].map(opt => (
                                        <button 
                                            key={String(opt)} 
                                            onClick={() => handleAnswer(opt)}
                                            className={`font-bold py-3 rounded-xl shadow text-white text-sm ${opt ? 'bg-emerald-500 border-b-2 border-emerald-700' : 'bg-rose-500 border-b-2 border-rose-700'}`}>
                                            {opt ? 'Betul 👍' : 'Salah 👎'}
                                        </button>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {/* JAWAPAN PENJELASAN / EQUATION */}
                    {showEquation && (
                        <div className="bg-emerald-50 border-2 border-emerald-300 p-3 rounded-2xl text-center mt-2 animate-bounce-gentle">
                            <span className="font-bold text-emerald-800 text-xs block">
                                {currentQ.eq || currentQ.explanation}
                            </span>
                        </div>
                    )}
                </div>
            )}

            {/* PAPAN KEDUDUKAN */}
            {screen === 'ranking' && (
                <div className="my-auto bg-white p-5 rounded-3xl shadow-xl border-2 border-sky-200">
                    <h2 className="text-lg font-bold text-amber-600 text-center mb-3">🏆 PAPAN KEDUDUKAN</h2>
                    <div className="bg-amber-50 p-3 rounded-2xl border border-amber-200 flex justify-between items-center mb-3">
                        <div className="flex items-center gap-2">
                            <span className="text-2xl">{avatar}</span>
                            <span className="font-bold text-slate-800 text-sm">{nickname || 'Murid'}</span>
                        </div>
                        <span className="font-bold text-amber-600 text-sm">{score} Mata</span>
                    </div>
                    <button onClick={() => setScreen('menu')} className="w-full bg-sky-500 text-white font-bold py-2 rounded-xl text-xs">
                        Kembali ke Menu
                    </button>
                </div>
            )}

            {/* MOD GURU / PBD */}
            {screen === 'teacher' && (
                <div className="my-auto bg-white p-5 rounded-3xl shadow-xl border-2 border-sky-200">
                    <h2 className="text-base font-bold text-indigo-900 text-center mb-3">👩‍🏫 MOD GURU & PENTAKSIRAN PBD</h2>
                    
                    {!teacherAuth ? (
                        <div className="flex flex-col gap-2">
                            <input 
                                type="password" 
                                placeholder="Masukkan kata laluan guru..."
                                value={passInput}
                                onChange={(e) => setPassInput(e.target.value)}
                                className="p-2 border rounded-xl text-center text-xs"
                            />
                            <button 
                                onClick={() => {
                                    if (passInput === '1234' || passInput === 'guru') {
                                        setTeacherAuth(true);
                                    } else {
                                        alert("Kata laluan salah!");
                                    }
                                }}
                                className="bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs">
                                Log Masuk Guru
                            </button>
                            <button onClick={() => setScreen('menu')} className="text-xs text-slate-500 font-bold mt-2">
                                Kembali
                            </button>
                        </div>
                    ) : (
                        <div className="flex flex-col gap-3 max-h-[400px] overflow-y-auto">
                            <div className="bg-indigo-50 p-3 rounded-2xl border border-indigo-200">
                                <p className="text-xs font-bold text-indigo-900">NAMA MURID: {nickname || 'Murid'}</p>
                                <p className="text-xs font-bold text-emerald-700 mt-1">TAHAP PENGUASAAN (TP): {calculateTP()}</p>
                            </div>

                            <div className="text-left text-[11px] bg-slate-50 p-2 rounded-xl border">
                                <p className="font-bold mb-1 border-b pb-1">REKOD LOG PERMAINAN:</p>
                                {logs.length === 0 ? (
                                    <p className="text-slate-400">Belum ada rekod penilaian.</p>
                                ) : (
                                    logs.map((l, i) => (
                                        <div key={i} className="py-1 border-b border-slate-100 flex justify-between">
                                            <span>{l.skill}</span>
                                            <span className={l.isCorrect ? "text-emerald-600 font-bold" : "text-rose-500 font-bold"}>
                                                {l.isCorrect ? "BETUL" : "SALAH"}
                                            </span>
                                        </div>
                                    ))
                                )}
                            </div>

                            <button onClick={() => window.print()} className="bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs no-print">
                                🖨️ Cetak Laporan PBD
                            </button>
                            <button onClick={() => setScreen('menu')} className="bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs">
                                Tutup
                            </button>
                        </div>
                    )}
                </div>
            )}

        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
