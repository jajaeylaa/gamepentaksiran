<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cilik Game Hub - Kedai Pasar</title>
  <style>
    /* Gaya Asas & Latar Belakang Toko */
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background: url('bg_main.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: #2e7d32;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 25px;
      border-radius: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
      margin-bottom: 15px;
    }

    /* Pemilihan Karakter Maskot */
    .character-selector {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .character-selector label {
      font-weight: bold;
      color: #333;
    }

    .character-selector select {
      padding: 5px 12px;
      border-radius: 8px;
      border: 2px solid #4caf50;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Kawasan Dialog Maskot */
    .mascot-container {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px 20px;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      margin-bottom: 25px;
      max-width: 600px;
      width: 90%;
    }

    .mascot-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-right: 15px;
    }

    .mascot-dialog {
      font-size: 1.1rem;
      color: #2c3e50;
      font-weight: bold;
      line-height: 1.4;
    }

    /* Grid Barangan Pasar */
    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    /* Kad Barangan Menggunakan Frame Kayu */
    .item-card {
      background: url('frame_card.jpg') no-repeat center center;
      background-size: 100% 100%;
      padding: 25px 15px 20px 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s ease-in-out;
    }

    .item-card:hover {
      transform: scale(1.05);
    }

    .item-card img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      mix-blend-mode: screen; /* Menapis latar belakang hitam pada gambar barang */
    }

    .item-title {
      color: #3e2723;
      font-size: 1.1rem;
      font-weight: bold;
      margin: 8px 0 4px 0;
    }

    .item-price {
      background-color: #ff9800;
      color: white;
      padding: 4px 12px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    /* Butang Aksi */
    .btn-action {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #2e7d32;
    }

    .btn-confirm {
      background-color: #2196f3;
      margin-left: 5px;
    }

    .btn-confirm:hover {
      background-color: #1565c0;
    }
  </style>
</head>
<body>

  <h1>🛒 SMART CILIK GAME HUB 🛍️</h1>

  <!-- Pemilihan Karakter -->
  <div class="character-selector">
    <label for="charSelect">Pilih Pembantu Anda:</label>
    <select id="charSelect" onchange="tukarKarakter()">
      <option value="musang">Musang Detektif 🦊</option>
      <option value="arnab">Arnab Detektif 🐰</option>
      <option value="panda">Panda Detektif 🐼</option>
    </select>
  </div>

  <!-- Bahagian Maskot -->
  <div class="mascot-container">
    <img id="mascot" class="mascot-img" src="musang_detektif.png" alt="Pembantu Game">
    <div id="dialog" class="mascot-dialog">
      "Selamat datang! Saya Musang Detektif. Mari kita cari dan kira barang bersama-sama!"
    </div>
  </div>

  <!-- Senarai Barangan Kedai -->
  <div class="market-grid">

    <!-- Barang 1 -->
    <div class="item-card">
      <img src="gula_2.jpg" alt="Gula Pasir">
      <div class="item-title">Gula Pasir</div>
      <div class="item-price">RM 3.00</div>
      <div>
        <button class="btn-action" onclick="pilihBarang('Gula Pasir')">Pilih</button>
        <button class="btn-action btn-confirm" onclick="selesaiBeli('Gula Pasir')">Beli</button>
      </div>
    </div>

    <!-- Barang 2 -->
    <div class="item-card">
      <img src="jus epal_2.jpg" alt="Jus Epal">
      <div class="item-title">Jus Epal</div>
      <div class="item-price">RM 2.00</div>
      <div>
        <button class="btn-action" onclick="pilihBarang('Jus Epal')">Pilih</button>
        <button class="btn-action btn-confirm" onclick="selesaiBeli('Jus Epal')">Beli</button>
      </div>
    </div>

    <!-- Barang 3 -->
    <div class="item-card">
      <img src="kicap_2.jpg" alt="Kicap Manis">
      <div class="item-title">Kicap Manis</div>
      <div class="item-price">RM 5.00</div>
      <div>
        <button class="btn-action" onclick="pilihBarang('Kicap Manis')">Pilih</button>
        <button class="btn-action btn-confirm" onclick="selesaiBeli('Kicap Manis')">Beli</button>
      </div>
    </div>

    <!-- Barang 4 -->
    <div class="item-card">
      <img src="sardin_2.jpg" alt="Sardin Tomato">
      <div class="item-title">Sardin Tomato</div>
      <div class="item-price">RM 6.00</div>
      <div>
        <button class="btn-action" onclick="pilihBarang('Sardin Tomato')">Pilih</button>
        <button class="btn-action btn-confirm" onclick="selesaiBeli('Sardin Tomato')">Beli</button>
      </div>
    </div>

    <!-- Barang 5 -->
    <div class="item-card">
      <img src="sos cili_2.jpg" alt="Sos Cili">
      <div class="item-title">Sos Cili</div>
      <div class="item-price">RM 4.00</div>
      <div>
        <button class="btn-action" onclick="pilihBarang('Sos Cili')">Pilih</button>
        <button class="btn-action btn-confirm" onclick="selesaiBeli('Sos Cili')">Beli</button>
      </div>
    </div>

    <!-- Barang 6 -->
    <div class="item-card">
      <img src="susu pekat_2.jpg" alt="Susu Pekat">
      <div class="item-title">Susu Pekat</div>
      <div class="item-price">RM 3.50</div>
      <div>
        <button class="btn-action" onclick="pilihBarang('Susu Pekat')">Pilih</button>
        <button class="btn-action btn-confirm" onclick="selesaiBeli('Susu Pekat')">Beli</button>
      </div>
    </div>

    <!-- Barang 7 -->
    <div class="item-card">
      <img src="susu segar_2.jpg" alt="Susu Segar">
      <div class="item-title">Susu Segar</div>
      <div class="item-price">RM 7.00</div>
      <div>
        <button class="btn-action" onclick="pilihBarang('Susu Segar')">Pilih</button>
        <button class="btn-action btn-confirm" onclick="selesaiBeli('Susu Segar')">Beli</button>
      </div>
    </div>

    <!-- Barang 8 -->
    <div class="item-card">
      <img src="teh_2.jpg" alt="Teh Wangi">
      <div class="item-title">Teh Wangi</div>
      <div class="item-price">RM 4.50</div>
      <div>
        <button class="btn-action" onclick="pilihBarang('Teh Wangi')">Pilih</button>
        <button class="btn-action btn-confirm" onclick="selesaiBeli('Teh Wangi')">Beli</button>
      </div>
    </div>

  </div>

  <script>
    // Data gambar dan dialog untuk setiap karakter
    const characters = {
      musang: {
        nama: "Musang Detektif",
        welcome: "musang_detektif.png",
        berpikir: "musang_berpikir.png",
        gembira: "musang_gembira.png",
        msgWelcome: '"Selamat datang! Saya Musang Detektif. Mari kita cari dan kira barang bersama-sama!"'
      },
      arnab: {
        nama: "Arnab Detektif",
        welcome: "arnab_detektif.png",
        berpikir: "arnab_berpikir.png",
        gembira: "arnab_gembira.png",
        msgWelcome: '"Hai! Saya Arnab Detektif. Siap untuk membantu kamu berbelanja hari ini!"'
      },
      panda: {
        nama: "Panda Pembantu",
        welcome: "panda_welcome.png",
        berpikir: "panda_berpikir.jpg",
        gembira: "panda_gembira.jpg",
        msgWelcome: '"Selamat datang ke kedai! Saya Panda, mari kita memilih barang yang hebat!"'
      }
    };

    let selectedChar = 'musang';

    function tukarKarakter() {
      selectedChar = document.getElementById('charSelect').value;
      const mascot = document.getElementById('mascot');
      const dialog = document.getElementById('dialog');

      mascot.src = characters[selectedChar].welcome;
      dialog.innerText = characters[selectedChar].msgWelcome;
    }

    function pilihBarang(namaBarang) {
      const mascot = document.getElementById('mascot');
      const dialog = document.getElementById('dialog');

      mascot.src = characters[selectedChar].berpikir;
      dialog.innerText = `🤔 Hmm, kamu memilih ${namaBarang}! Tahukah kamu berapa harganya?`;
    }

    function selesaiBeli(namaBarang) {
      const mascot = document.getElementById('mascot');
      const dialog = document.getElementById('dialog');

      mascot.src = characters[selectedChar].gembira;
      dialog.innerText = `🎉 Syabas! Kamu berhasil membeli ${namaBarang}! Hebat sekali!`;
    }
  </script>

</body>
</html>
